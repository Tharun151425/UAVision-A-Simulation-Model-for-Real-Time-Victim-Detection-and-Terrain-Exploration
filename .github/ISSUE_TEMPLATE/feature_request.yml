name: Feature request
description: Propose a new environment, algorithm, evaluation, or documentation improvement.
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Feature requests are most useful when they describe the research or
        engineering question, not only the desired implementation.

  - type: textarea
    id: problem
    attributes:
      label: Problem or research question
      description: What is missing or hard to do today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest useful version.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Phase-2 curriculum
        - AirSim RL
        - Perception or detection
        - Evaluation and metrics
        - Multi-agent swarm
        - Documentation
        - CI / tooling
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: textarea
    id: evidence
    attributes:
      label: How would we know it works?
      description: Proposed metric, experiment, or acceptance criterion.
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight checks
      options:
        - label: I checked the roadmap and existing issues.
          required: true
        - label: I understand this is a research prototype, not a product backlog.
          required: true
