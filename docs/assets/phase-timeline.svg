<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" role="img" aria-labelledby="title desc">
  <title id="title">UAVision development timeline</title>
  <desc id="desc">A four-stage timeline from the legacy Unreal prototype through AirSim DQN and PyBullet curriculum to the integrated v1.0 research release, followed by a dashed swarm roadmap.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101c2e"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="0.34" stop-color="#38bdf8"/>
      <stop offset="0.72" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <style>
      .title { font: 700 30px 'Segoe UI', Arial, sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 15px 'Segoe UI', Arial, sans-serif; fill: #94a3b8; }
      .date { font: 700 12px 'Segoe UI', Arial, sans-serif; fill: #7dd3fc; letter-spacing: 1.5px; }
      .h { font: 700 17px 'Segoe UI', Arial, sans-serif; fill: #f1f5f9; }
      .body { font: 400 12.5px 'Segoe UI', Arial, sans-serif; fill: #cbd5e1; }
      .small { font: 400 11px 'Segoe UI', Arial, sans-serif; fill: #94a3b8; }
      .tag { font: 700 10px 'Segoe UI', Arial, sans-serif; fill: #0b1220; }
      .card { fill: #111c2e; stroke: #27405f; stroke-width: 1.4; rx: 14; }
    </style>
  </defs>

  <rect width="1200" height="530" fill="url(#bg)"/>
  <circle cx="1100" cy="80" r="150" fill="#a78bfa" opacity="0.07"/>
  <circle cx="90" cy="460" r="160" fill="#f59e0b" opacity="0.05"/>

  <text x="64" y="64" class="title">From manual flight to a search curriculum</text>
  <text x="64" y="90" class="subtitle">Each stage keeps the previous one reproducible; branches preserve the full engineering trail.</text>

  <!-- Main timeline -->
  <line x1="100" y1="226" x2="1100" y2="226" stroke="#1e3a56" stroke-width="10" stroke-linecap="round"/>
  <line x1="100" y1="226" x2="1040" y2="226" stroke="url(#line)" stroke-width="4" stroke-linecap="round"/>

  <!-- Stage 1 -->
  <circle cx="170" cy="226" r="13" fill="#f59e0b" stroke="#0b1220" stroke-width="5"/>
  <rect x="70" y="268" width="238" height="150" class="card"/>
  <text x="90" y="296" class="date">NOV 10  •  v0.1.0</text>
  <text x="90" y="322" class="h">Legacy Unreal prototype</text>
  <text x="90" y="346" class="body">Manual GTA-style flight,</text>
  <text x="90" y="366" class="body">segmentation detection,</text>
  <text x="90" y="386" class="body">occupancy grid + registry.</text>
  <text x="90" y="408" class="small">Branch: legacy/old-unreal</text>

  <!-- Stage 2 -->
  <circle cx="430" cy="226" r="13" fill="#38bdf8" stroke="#0b1220" stroke-width="5"/>
  <rect x="320" y="268" width="250" height="150" class="card"/>
  <text x="340" y="296" class="date">NOV 11-12  •  v0.2.0</text>
  <text x="340" y="322" class="h">AirSim DQN pipeline</text>
  <text x="340" y="346" class="body">Depth + LiDAR observation,</text>
  <text x="340" y="366" class="body">resumable training, demo</text>
  <text x="340" y="386" class="body">player, baseline model card.</text>
  <text x="340" y="408" class="small">Branch: feature/airsim-rl</text>

  <!-- Stage 3 -->
  <circle cx="700" cy="226" r="13" fill="#22d3ee" stroke="#0b1220" stroke-width="5"/>
  <rect x="590" y="268" width="250" height="150" class="card"/>
  <text x="610" y="296" class="date">NOV 12  •  v0.3.0</text>
  <text x="610" y="322" class="h">PyBullet curriculum</text>
  <text x="610" y="346" class="body">Phase 2A recognition,</text>
  <text x="610" y="366" class="body">2B occlusion, 2C search,</text>
  <text x="610" y="386" class="body">GRU memory + fog map.</text>
  <text x="610" y="408" class="small">Branch: feature/sar-swarm</text>

  <!-- Stage 4 -->
  <circle cx="960" cy="226" r="16" fill="#a78bfa" stroke="#0b1220" stroke-width="5"/>
  <rect x="850" y="268" width="250" height="150" fill="#1b1733" stroke="#a78bfa" stroke-width="1.8" rx="14"/>
  <text x="870" y="296" class="date">NOV 13  •  v1.0.0</text>
  <text x="870" y="322" class="h">Integrated release</text>
  <text x="870" y="346" class="body">Unified main, setup and</text>
  <text x="870" y="366" class="body">architecture docs, literature</text>
  <text x="870" y="386" class="body">survey, CI, screenshots.</text>
  <text x="870" y="408" class="small">Tag: v1.0.0</text>

  <!-- Branch labels above line -->
  <text x="170" y="190" class="date" text-anchor="middle">MANUAL</text>
  <text x="430" y="190" class="date" text-anchor="middle">HIGH FIDELITY</text>
  <text x="700" y="190" class="date" text-anchor="middle">SCALE</text>
  <text x="960" y="190" class="date" text-anchor="middle">INTEGRATE</text>

  <!-- Roadmap -->
  <line x1="1100" y1="226" x2="1148" y2="226" stroke="#64748b" stroke-width="2" stroke-dasharray="5 6"/>
  <rect x="590" y="456" width="510" height="48" rx="12" fill="#0f1726" stroke="#334155" stroke-width="1.2" stroke-dasharray="6 5"/>
  <text x="610" y="477" class="date">NEXT  •  ROADMAP</text>
  <text x="610" y="495" class="small">Multi-agent frontier assignment, shared fog map, Jetson deployment, field trials</text>
  <path d="M 1100 250 C 1100 360 900 430 850 456" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="5 6" opacity="0.65"/>

  <text x="64" y="500" class="small">Commit history is date-stamped and branch-separated so reviewers can inspect each stage independently.</text>
</svg>
