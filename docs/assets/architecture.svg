<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">UAVision system architecture</title>
  <desc id="desc">Two simulation fidelities feed a shared perception and policy stack, which produces search-and-rescue actions and evaluation telemetry.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#13233b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7dd3fc"/>
    </marker>
    <style>
      .title { font: 700 30px 'Segoe UI', Arial, sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 15px 'Segoe UI', Arial, sans-serif; fill: #94a3b8; }
      .band { font: 700 13px 'Segoe UI', Arial, sans-serif; fill: #7dd3fc; letter-spacing: 2px; }
      .h { font: 700 17px 'Segoe UI', Arial, sans-serif; fill: #f1f5f9; }
      .body { font: 400 13px 'Segoe UI', Arial, sans-serif; fill: #cbd5e1; }
      .small { font: 400 11px 'Segoe UI', Arial, sans-serif; fill: #94a3b8; }
      .mono { font: 500 12px 'Consolas', 'Courier New', monospace; fill: #a5f3fc; }
      .box { fill: #111c2e; stroke: #27405f; stroke-width: 1.4; rx: 14; }
      .box-accent { fill: #0f2438; stroke: #38bdf8; stroke-width: 1.8; }
      .box-warm { fill: #2a1d12; stroke: #f59e0b; stroke-width: 1.4; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="url(#bg)"/>
  <circle cx="1080" cy="90" r="170" fill="#0ea5e9" opacity="0.08"/>
  <circle cx="120" cy="690" r="190" fill="#22d3ee" opacity="0.06"/>

  <text x="64" y="66" class="title">UAVision system architecture</text>
  <text x="64" y="92" class="subtitle">Multi-fidelity simulation, explicit perception contracts, and reproducible search policies</text>

  <!-- Fidelity band -->
  <text x="64" y="142" class="band">SIMULATION FIDELITY</text>

  <rect x="64" y="160" width="500" height="176" rx="16" fill="#111c2e" stroke="#27405f" stroke-width="1.4"/>
  <text x="88" y="194" class="h">Unreal Engine + AirSim</text>
  <text x="88" y="220" class="body">High-fidelity scene, RGB/depth/segmentation, LiDAR, flight primitives</text>
  <text x="88" y="244" class="mono">airsim/  •  config/settings.json  •  CameraDirector patch</text>
  <text x="88" y="278" class="body">Use for visual validation, operator demos, and sensor realism.</text>
  <text x="88" y="302" class="small">Cost per step: high  •  Rendering: real-time  •  Scene: Blocks / custom Unreal map</text>

  <rect x="64" y="356" width="500" height="176" rx="16" fill="#0f2438" stroke="#38bdf8" stroke-width="1.8"/>
  <text x="88" y="390" class="h">PyBullet curriculum</text>
  <text x="88" y="416" class="body">Headless physics, 32x8 raycast grid, abstract obstacles, fog-of-war map</text>
  <text x="88" y="440" class="mono">phase_2/  •  sensors/  •  utils/fog_map.py</text>
  <text x="88" y="474" class="body">Use for large-scale PPO / RecurrentPPO training and ablations.</text>
  <text x="88" y="498" class="small">Cost per step: low  •  Rendering: optional  •  Scene: procedural 40-50 m maps</text>

  <!-- Observation band -->
  <text x="624" y="142" class="band">PERCEPTION CONTRACT</text>

  <rect x="624" y="160" width="238" height="176" class="box"/>
  <text x="648" y="194" class="h">AirSim observation</text>
  <text x="648" y="222" class="body">84x84x1 depth image</text>
  <text x="648" y="246" class="body">8 LiDAR sector minima</text>
  <text x="648" y="270" class="body">3-D target direction</text>
  <text x="648" y="304" class="mono">Dict space</text>

  <rect x="886" y="160" width="250" height="176" class="box"/>
  <text x="910" y="194" class="h">PyBullet observation</text>
  <text x="910" y="222" class="body">256 first-hit ray codes</text>
  <text x="910" y="246" class="body">5 ego values + time</text>
  <text x="910" y="270" class="body">256 fog cells (GRU)</text>
  <text x="910" y="304" class="mono">262 or 519 floats</text>

  <!-- Shared policy band -->
  <text x="624" y="390" class="band">DECISION + MEMORY</text>

  <rect x="624" y="408" width="512" height="124" rx="16" fill="#131f33" stroke="#22d3ee" stroke-width="1.8" filter="url(#glow)"/>
  <text x="648" y="442" class="h">Search policy</text>
  <text x="648" y="470" class="body">AirSim: DQN with replay buffer</text>
  <text x="648" y="494" class="body">PyBullet: PPO (MLP) or RecurrentPPO (LSTM + fog patch)</text>
  <text x="918" y="470" class="mono">6 actions</text>
  <text x="918" y="494" class="small">turn L/R, up/down, forward, scan</text>

  <!-- Action band -->
  <text x="624" y="566" class="band">ACTION + EVALUATION</text>

  <rect x="624" y="584" width="238" height="100" class="box"/>
  <text x="648" y="616" class="h">Flight command</text>
  <text x="648" y="642" class="body">waypoint, yaw, altitude</text>
  <text x="648" y="666" class="small">simulation only</text>

  <rect x="886" y="584" width="250" height="100" class="box-warm"/>
  <text x="910" y="616" class="h">Telemetry</text>
  <text x="910" y="642" class="body">reward, success, crash, timeout</text>
  <text x="910" y="666" class="small">TensorBoard + CSV/logs</text>

  <!-- Arrows -->
  <path d="M 564 248 C 592 248 596 248 624 248" fill="none" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 564 444 C 592 444 596 444 624 444" fill="none" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 862 248 L 886 248" fill="none" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 880 336 C 880 366 880 380 880 408" fill="none" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 760 532 L 743 584" fill="none" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 900 532 L 980 584" fill="none" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 1011 684 C 1011 718 760 728 350 728 C 160 728 96 700 96 540" fill="none" stroke="#22d3ee" stroke-width="1.4" stroke-dasharray="6 6" marker-end="url(#arrow)" opacity="0.7"/>
  <text x="650" y="716" class="small">closed-loop evaluation feeds curriculum and reward design</text>

  <!-- Footer -->
  <text x="64" y="728" class="small">Repository: github.com/Tharun151425/UAVision-A-Simulation-Model-for-Real-Time-Victim-Detection-and-Terrain-Exploration</text>
</svg>
